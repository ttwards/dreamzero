# @package _global_

# Native frame-wise EgoVLA WebDataset. One source sample is one 30 Hz control
# step; one model block consumes 24 actions, eight sampled frames, and one
# terminal boundary frame shared with the next block.
defaults:
  - dreamzero/base_48_wan_fine_aug_relative
  - _self_

num_frames: 33
action_horizon: 24
state_horizon: 1
max_state_dim: 64
max_action_dim: 48
num_views: 2
max_chunk_size: 4

egovla_wds_shards: ???
egovla_wds_metadata_path: ???
wds_keep_ratio: 0.1
wds_shuffle_buffer: 256
wds_shuffle_initial: 32

train_dataset:
  _target_: groot.vla.data.dataset.egovla_wds.EgoVLAWdsDataset
  shard_urls: ${egovla_wds_shards}
  metadata_path: ${egovla_wds_metadata_path}
  transforms: ${transform_dual_arm_dexterous_hand}
  training: true
  action_horizon: ${action_horizon}
  max_chunk_size: ${max_chunk_size}
  video_offsets: [0, 3, 6, 9, 12, 15, 18, 21]
  relative_action: true
  load_chest: true
  keep_ratio: ${wds_keep_ratio}
  shuffle_buffer: ${wds_shuffle_buffer}
  shuffle_initial: ${wds_shuffle_initial}
  seed: ${seed}
