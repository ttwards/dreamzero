# @package _global_

# Template for the LeRobot v3 dual-arm dexterous-hand dataset.
defaults:
  - dreamzero/base_48_wan_fine_aug_relative
  - _self_

# EgoVLA order: dual wrist position 6 + dual wrist rotation6d 12
# + ten fingertip XYZ 30 = 48D state and 48D action.
max_state_dim: 64
max_action_dim: 48
use_global_metadata: false
relative_action: true
relative_action_per_horizon: false
# Do not subtract 6D rotations: that representation is not additive.
relative_action_keys:
  - left_wrist_position
  - right_wrist_position
  - left_fingertip_position
  - right_fingertip_position
max_chunk_size: 4
dataset_shard_sampling_rate: 0.1
mixture_dataset_cls: groot.vla.data.dataset.lerobot_sharded.ShardedLeRobotMixtureDataset.from_mixture_spec
single_dataset_cls: groot.vla.data.dataset.lerobot_sharded.ShardedLeRobotSubLangSingleActionChunkDatasetDROID

# Override this path with the root containing meta/info.json (codebase_version: v3.0).
dual_arm_dexterous_hand_data_root: ???

train_dataset:
  _target_: ${mixture_dataset_cls}
  _convert_: object
  mixture_spec:
    - dataset_path:
        dual_arm_dexterous_hand:
          - ${dual_arm_dexterous_hand_data_root}
      dataset_weight: 1.0
      distribute_weights: true

  dataset_class: ${single_dataset_cls}
  all_modality_configs: ${modality_configs}
  all_transforms: ${transforms}
  metadata_versions: ${metadata_versions}
  fps: ${fps}
  dataset_kwargs:
    video_backend: decord
    use_global_metadata: ${use_global_metadata}
    max_chunk_size: ${max_chunk_size}
    relative_action: ${relative_action}
    relative_action_keys: ${relative_action_keys}
    relative_action_per_horizon: ${relative_action_per_horizon}
    use_precomputed_text_embeddings: true
    text_embedding_cache_size: 128
  mixture_kwargs:
    training: true
    balance_dataset_weights: false
    seed: 42
    shard_sampling_rate: ${dataset_shard_sampling_rate}
    # Keep one full four-chunk context per physical microbatch. Incomplete
    # language/boundary windows are skipped instead of padded or combined.
    fixed_chunk_count: ${max_chunk_size}
    fixed_chunk_action_horizon: ${action_horizon}
